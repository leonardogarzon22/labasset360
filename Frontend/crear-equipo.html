<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>LabAsset 360 - Nuevo Equipo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f4f6fb;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar consistente con el ecosistema */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #243B8F, #1C2C70);
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar-menu h2 {
            margin-bottom: 40px;
            font-weight: 600;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar li:hover,
        .sidebar li.active {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-logout {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.4);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-logout:hover {
            background: #e74c3c;
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #111827;
            font-size: 1.8rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            font-weight: 600;
            color: #4b5563;
        }

        /* Formulario Estilo ISO */
        .form-container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            border-top: 4px solid #243B8F;
            max-width: 800px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #1f2937;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #243B8F;
            box-shadow: 0 0 0 3px rgba(36, 59, 143, 0.15);
        }

        .btn-submit {
            background: #243B8F;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #1C2C70;
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #error-msg {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
            border: 1px dashed #ef4444;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-menu">
                <h2>LabAsset 360</h2>
                <ul>
                    <li onclick="window.location.href='dashboard.html'"><i class="fas fa-chart-pie"></i> Dashboard</li>
                    <li class="active" onclick="window.location.href='crear-equipo.html'"><i
                            class="fas fa-plus-circle"></i> Nuevo Equipo</li>
                    <li onclick="window.location.href='historico.html'"><i class="fas fa-history"></i> Historial</li>
                    <li onclick="window.location.href='reporte.html'"><i class="fas fa-file-alt"></i> Reportes ISO</li>
                    <li onclick="window.location.href='mapa-ubicacion.html'"><i class="fas fa-map-marker-alt"></i>
                        Ubicaciones</li>
                </ul>
            </div>
            <button class="btn-logout" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar
                Sesión</button>
        </div>

        <div class="main-content">
            <div class="header">
                <div>
                    <h1>Registro de Nuevo Activo</h1>
                    <p style="color: #6b7280; font-size: 0.9rem; margin-top: 5px;">Alta de instrumentos en el Inventario
                        Metrológico de Calidad.</p>
                </div>
                <div class="user-profile">
                    <i class="fas fa-user-flask" style="color: #243B8F;"></i>
                    <span id="txt-usuario">Científico</span>
                </div>
            </div>

            <div class="form-container">
                <div id="error-msg"></div>

                <form id="form-crear-equipo" onsubmit="enviarFormulario(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="codigo">Código del Activo *</label>
                            <input type="text" id="codigo" placeholder="Ej: BL-001, PH-02" required>
                        </div>

                        <div class="form-group">
                            <label for="tipo_equipo_id">Tipo / Categoría de Instrumento *</label>
                            <select id="tipo_equipo_id" required>
                                <option value="" disabled selected>Cargando categorías...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="marca">Marca</label>
                            <input type="text" id="marca" placeholder="Ej: Mettler Toledo, Agilent">
                        </div>

                        <div class="form-group">
                            <label for="modelo">Modelo</label>
                            <input type="text" id="modelo" placeholder="Ej: XP205, Infinity II">
                        </div>

                        <div class="form-group">
                            <label for="serial">Número de Serial</label>
                            <input type="text" id="serial" placeholder="Ej: SN987654321">
                        </div>

                        <div class="form-group">
                            <label for="ubicacion">Ubicación Inicial Interna</label>
                            <input type="text" id="ubicacion" placeholder="Ej: Laboratorio A, Estante 3">
                        </div>

                        <div class="form-group">
                            <label for="nivel_uso">Nivel de Criticidad / Uso *</label>
                            <select id="nivel_uso" required>
                                <option value="Bajo">Bajo (Uso esporádico)</option>
                                <option value="Medio" selected>Medio (Uso diario estándar)</option>
                                <option value="Alto">Alto (Operación continua / Crítico)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fecha_inicio_operacion">Fecha de Entrada en Operación</label>
                            <input type="date" id="fecha_inicio_operacion">
                        </div>

                        <div class="form-group full-width">
                            <label for="observaciones_iniciales">Observaciones Iniciales de Calibración / Estado</label>
                            <textarea id="observaciones_iniciales" rows="3"
                                placeholder="Detalles de recepción del equipo o estado metrológico inicial..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-submit">
                        <i class="fas fa-save"></i> Registrar Activo
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="voice-indicator"
        style="position: fixed; bottom: 30px; right: 30px; background: #243B8F; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 10000; transition: 0.3s;"
        onclick="VoiceEngine.toggle()">
        <img src="desactivado.png" class="icon-off" alt="Micrófono Desactivado"
            style="width: 110px; height: 110px; object-fit: contain;">
        <img src="activado.png" class="icon-on" alt="Micrófono Activado"
            style="width: 110px; height: 110px; object-fit: contain; display: none;">
    </div>

    <style>
        #voice-indicator.active {
            background: #e74c3c !important;
            animation: pulseVoice 1.5s infinite;
        }

        #voice-indicator.active .icon-off {
            display: none !important;
        }

        #voice-indicator.active .icon-on {
            display: block !important;
        }

        @keyframes pulseVoice {
            0% {
                box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(231, 76, 60, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(231, 76, 60, 0);
            }
        }
    </style>

    <script src="js/voice-engine.js"></script>

    <script>
        // ==========================================
        // 1. BLINDAJE DE SEGURIDAD (AUTH GUARD)
        // ==========================================
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = "index.html";
        }

        const API_BASE_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
            ? "http://localhost:8000"
            : "";

        // Inicializar perfil de usuario
        const nombreUsuario = localStorage.getItem('usuario_nombre');
        if (nombreUsuario) {
            document.getElementById('txt-usuario').innerText = nombreUsuario;
        }

        // ==========================================
        // 2. CARGA DE TIPOS DE EQUIPO DESDE BASE DE DATOS
        // ==========================================
        async function cargarTiposEquipos() {
            const selectTipo = document.getElementById('tipo_equipo_id');
            try {
                const response = await fetch(`${API_BASE_URL}/api/tipos-equipos`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 401) { cerrarSesion(); return; }
                if (!response.ok) throw new Error("No se pudo obtener el listado de tipos de equipo.");

                const tipos = await response.json();

                selectTipo.innerHTML = ""; // Limpiar placeholder de carga
                if (tipos.length === 0) {
                    selectTipo.innerHTML = `<option value="" disabled selected>No hay categorías guardadas</option>`;
                    return;
                }

                tipos.forEach(tipo => {
                    const option = document.createElement('option');
                    option.value = tipo.id;
                    option.textContent = `${tipo.nombre} (Cat: ${tipo.categoria || 'General'})`;
                    selectTipo.appendChild(option);
                });

            } catch (error) {
                console.error("Error al cargar componentes metrológicos:", error);
                selectTipo.innerHTML = `<option value="" disabled selected>⚠️ Error al conectar con el servidor</option>`;
            }
        }

        // ==========================================
        // 3. ENVÍO SEGURO DEL FORMULARIO (POST)
        // ==========================================
        async function enviarFormulario(event) {
            event.preventDefault();

            const btn = document.getElementById('btn-submit');
            const errorContainer = document.getElementById('error-msg');
            errorContainer.style.display = "none";

            // Obtener el ID de empresa asignado dinámicamente en el login
            const empresaId = localStorage.getItem('empresa_id');

            // Mapeo y sanitización rigurosa del Payload
            const payload = {
                codigo: document.getElementById('codigo').value.trim(),
                tipo_equipo_id: parseInt(document.getElementById('tipo_equipo_id').value),
                marca: document.getElementById('marca').value.trim() || null,
                modelo: document.getElementById('modelo').value.trim() || null,
                serial: document.getElementById('serial').value.trim() || null,
                ubicacion: document.getElementById('ubicacion').value.trim() || null,
                nivel_uso: document.getElementById('nivel_uso').value,
                fecha_inicio_operacion: document.getElementById('fecha_inicio_operacion').value || null,
                observaciones_iniciales: document.getElementById('observaciones_iniciales').value.trim() || null,
                empresa_id: empresaId ? parseInt(empresaId) : 1 // Respaldo seguro por defecto
            };

            // Prevención UX: Bloqueo de re-envíos por lag de red
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sincronizando Activo...`;

            try {
                const response = await fetch(`${API_BASE_URL}/api/equipos`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.status === 401) { cerrarSesion(); return; }

                const data = await response.json();

                if (!response.ok) {
                    errorContainer.innerText = `❌ Error de Integridad: ${data.detail || 'No se pudo dar de alta el instrumento.'}`;
                    errorContainer.style.display = "block";

                    // Reactivación si hay fallos en la validación del backend
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-save"></i> Registrar Activo`;
                } else {
                    alert("✅ Instrumento incorporado con éxito al Inventario Metrológico de la plataforma.");
                    window.location.href = "dashboard.html";
                }

            } catch (error) {
                console.error("Fallo crítico en solicitud POST:", error);
                errorContainer.innerText = "📡 Error de enlace de red: El servidor central no responde. Intente nuevamente.";
                errorContainer.style.display = "block";

                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-save"></i> Registrar Activo`;
            }
        }

        // ==========================================
        // 4. LOGOUT DE COMPORTAMIENTO SAAS
        // ==========================================
        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        // Orquestación al levantar la pantalla
        window.onload = () => {
            cargarTiposEquipos();
        };
    </script>
</body>

</html>
