<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>LabAsset 360 - Gestión Segura</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY_PUBLICO&libraries=places"></script>
    <style>
        /* Mantén tus estilos CSS existentes aquí */
        body {
            background: #f4f6fb;
            display: flex;
            height: 100vh;
            margin: 0;
        }

        #map {
            flex-grow: 1;
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="sidebar-historial">
        <input type="text" id="busqueda" placeholder="Dirección...">
    </div>
    <div id="map"></div>

    <script>
        let map, marker;

        function initMap() {
            // Inicialización centrada por defecto
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 4.6097, lng: -74.0817 }, // Bogotá ejemplo
                zoom: 15
            });

            map.addListener('click', (e) => {
                colocarMarcador(e.latLng.lat(), e.latLng.lng());
            });
        }

        async function colocarMarcador(lat, lng) {
            if (marker) marker.setMap(null);

            marker = new google.maps.Marker({
                position: { lat, lng },
                map: map,
                draggable: true
            });

            // En lugar de llamar a una API pública en el front, 
            // llamamos a NUESTRO backend para obtener la dirección
            try {
                const response = await fetch(`/api/geocodificar?lat=${lat}&lng=${lng}`);
                const data = await response.json();
                document.getElementById("busqueda").value = data.direccion;
            } catch (error) {
                console.error("Error al obtener dirección segura:", error);
            }
        }

        window.onload = initMap;
    </script>
</body>

</html>
