<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Etiqueta Inteligente QR - LabAsset 360</title>

    <script>
        (function () {
            if (!localStorage.getItem("access_token")) {
                window.location.replace("index.html");
            }
        })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #eef2fb;
            padding: 30px;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .btn-download {
            background: #243B8F;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-download:hover {
            background: #1C2C70;
        }

        .etiqueta-container {
            width: 900px;
            margin: auto;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            border: 2px solid #e0e6ed;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 40px;
        }

        .salud-bar {
            background: #eee;
            height: 10px;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }

        .salud-fill {
            background: #27ae60;
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }
    </style>
</head>

<body>

    <div class="toolbar">
        <button class="btn-download" onclick="descargarPDF()">Descargar PDF</button>
    </div>

    <div class="etiqueta-container" id="etiqueta">
        <div class="header">
            <div>
                <h1 style="color:#243B8F;">ID Activo</h1>
                <p id="codigo-equipo" style="font-size: 1.5rem; font-weight: bold;"></p>
            </div>
            <div id="qrcode"></div>
        </div>

        <div class="content">
            <div>
                <h3>Estado del Activo</h3>
                <p id="estado" style="font-size: 1.2rem; color: #555;"></p>
                <br>
                <h3>Salud del Equipo</h3>
                <div class="salud-bar">
                    <div id="saludFill" class="salud-fill"></div>
                </div>
                <p><span id="saludTexto">0</span>% Salud Operativa</p>
            </div>
            <div style="text-align: right;">
                <p><b>Fecha emisión:</b><br><span id="fecha"></span></p>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        // CONFIGURACIÓN DE SEGURIDAD
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://127.0.0.1:8000'
            : 'https://labasset360.onrender.com';

        const AuthEngine = {
            getToken() { return localStorage.getItem("access_token"); },
            getAuthHeaders() {
                return {
                    'Authorization': `Bearer ${this.getToken()}`,
                    'Content-Type': 'application/json'
                };
            },
            manejarError(res) {
                if (res.status === 401 || res.status === 403) {
                    localStorage.clear();
                    window.location.replace("index.html");
                }
            }
        };

        async function cargarDatos() {
            if (!id) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/equipos/${id}`, {
                    headers: AuthEngine.getAuthHeaders()
                });
                AuthEngine.manejarError(res);
                const e = await res.json();

                document.getElementById("codigo-equipo").innerText = e.codigo;
                document.getElementById("estado").innerText = (e.estado || "-").toUpperCase();

                const salud = parseFloat(e.indice_salud || 0);
                document.getElementById("saludFill").style.width = `${salud}%`;
                document.getElementById("saludTexto").innerText = salud;
                document.getElementById("fecha").innerText = new Date().toLocaleDateString();

                // Generar QR
                new QRCode(document.getElementById("qrcode"), {
                    text: `${window.location.origin}/kiosko.html?id=${e.id}`,
                    width: 150,
                    height: 150,
                    colorDark: "#243B8F",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

            } catch (err) {
                console.error("Error crítico de acceso:", err);
            }
        }

        function descargarPDF() {
            const element = document.getElementById("etiqueta");
            html2pdf().set({
                margin: 10,
                filename: `Etiqueta_${id}.pdf`,
                image: { type: "jpeg", quality: 1 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
            }).from(element).save();
        }

        cargarDatos();
    </script>
</body>

</html>
