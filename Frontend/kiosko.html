<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Kiosco - Gestión de Activos</title>

    <script>
        (function () {
            if (!localStorage.getItem("access_token")) {
                window.location.replace("index.html");
            }
        })();
    </script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --color-solicitar: #3b82f6;
            --color-falla: #ef4444;
            --color-reporte: #8b5cf6;
            --color-mant: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .kiosko-container {
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>

<body>

    <div class="kiosko-container" id="app">
    </div>

    <script>
        // CONFIGURACIÓN DE SEGURIDAD
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://127.0.0.1:8000'
            : 'https://labasset360.onrender.com';

        const AuthEngine = {
            getToken() { return localStorage.getItem("access_token"); },
            getAuthHeaders() {
                return {
                    'Authorization': `Bearer ${this.getToken()}`,
                    'Content-Type': 'application/json'
                };
            },
            manejarError(res) {
                if (res.status === 401 || res.status === 403) {
                    localStorage.clear();
                    window.location.replace("index.html");
                }
            }
        };

        // Ejemplo de uso: cargar datos del equipo en el kiosco
        async function initKiosco() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) return;

            try {
                const res = await fetch(`${API_BASE_URL}/api/equipos/${id}`, {
                    headers: AuthEngine.getAuthHeaders()
                });
                AuthEngine.manejarError(res);
                const data = await res.json();
                // Renderizar datos...
            } catch (err) {
                console.error("Error en Kiosko:", err);
            }
        }

        initKiosco();
    </script>
</body>

</html>
