<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>LabAsset 360 - Registro de Anomalías</title>

    <script>
        (function () {
            if (!localStorage.getItem("access_token")) {
                window.location.replace("index.html");
            }
        })();
    </script>

    <style>
        :root {
            --primary: #243B8F;
            --accent: #38C6A7;
            --bg: #f4f6fb;
            --text-main: #1C2C70;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .kiosko-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .panel-elegante {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-top: 6px solid var(--primary);
        }

        .panel-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .panel-header h2 {
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #1C2C70;
        }
    </style>
</head>

<body>

    <div class="kiosko-container">
        <div class="panel-elegante">
            <div class="panel-header">
                <h2>Reportar Anomalía</h2>
                <p>Ecosistema LabAsset 360</p>
            </div>
            <form id="formFalla">
                <div class="form-group">
                    <label>ID Equipo</label>
                    <input type="text" id="equipo_id" required>
                </div>
                <div class="form-group">
                    <label>Descripción de la Falla</label>
                    <textarea id="descripcion" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-submit" id="btn-submit">Enviar Reporte</button>
            </form>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE SEGURIDAD
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://127.0.0.1:8000'
            : 'https://labasset360.onrender.com';

        const AuthEngine = {
            getToken() { return localStorage.getItem("access_token"); },
            getAuthHeaders() {
                return {
                    'Authorization': `Bearer ${this.getToken()}`,
                    'Content-Type': 'application/json'
                };
            },
            manejarError(res) {
                if (res.status === 401 || res.status === 403) {
                    localStorage.clear();
                    window.location.replace("index.html");
                }
            }
        };

        document.getElementById('formFalla').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;

            const payload = {
                equipo_id: document.getElementById('equipo_id').value,
                descripcion: document.getElementById('descripcion').value
            };

            try {
                const res = await fetch(`${API_BASE_URL}/api/fallas`, {
                    method: 'POST',
                    headers: AuthEngine.getAuthHeaders(),
                    body: JSON.stringify(payload)
                });

                AuthEngine.manejarError(res);

                if (res.ok) {
                    alert("Reporte enviado correctamente.");
                    window.location.href = "dashboard.html";
                } else {
                    alert("Error al enviar el reporte.");
                    btn.disabled = false;
                }
            } catch (err) {
                console.error("Error crítico:", err);
                btn.disabled = false;
            }
        };
    </script>
</body>

</html>
